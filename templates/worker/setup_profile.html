{% extends "base.html" %}
{% from "_macros.html" import avatar, verified_badge %}
{% block content %}
<div class="container" style="max-width:520px;">
  <div class="section-title" style="text-align:center;">{{ 'Edit' if profile else 'Set up' }} your professional profile</div>
  <div class="section-sub" style="text-align:center;">This is what customers will see when they browse.</div>

  <div class="form-card">
    <form method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label>Profile Photo (JPG, PNG or WEBP, max 3 MB)</label>
        <div style="display:flex; align-items:center; gap:14px;">
          {% if profile %}{{ avatar(profile, 'lg') }}{% endif %}
          <input type="file" name="photo" accept="image/png,image/jpeg,image/webp">
        </div>
      </div>
      <div class="form-group">
        <label>Service Category</label>
        <select name="category" required>
          {% for cat in categories %}
            <option value="{{ cat }}" {% if profile and profile.category == cat %}selected{% endif %}>{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="3" placeholder="e.g. 8 years fixing residential wiring, licensed and insured.">{{ profile.description if profile else '' }}</textarea>
      </div>
      <div class="form-group">
        <label>Price per Visit (₹)</label>
        <input type="number" name="price_per_visit" min="0" step="1" value="{{ profile.price_per_visit|int if profile else '' }}" required>
      </div>
      <div class="form-group">
        <label>Years of Experience</label>
        <input type="number" name="experience_years" min="0" value="{{ profile.experience_years if profile else '' }}">
      </div>
      <button type="submit" class="btn btn-amber btn-block">Save Profile</button>
    </form>
  </div>
</div>
{% endblock %}
