{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width:520px;">
  <div class="section-title" style="text-align:center;">Rate {{ booking.worker_profile.user.name }}</div>
  <div class="section-sub" style="text-align:center;">How was the {{ booking.worker_profile.category|lower }} service?</div>

  <div class="form-card">
    <form method="POST">
      <div class="form-group">
        <label>Rating</label>
        <select name="rating" required>
          <option value="5">★★★★★ — Excellent</option>
          <option value="4">★★★★ — Good</option>
          <option value="3">★★★ — Okay</option>
          <option value="2">★★ — Below Average</option>
          <option value="1">★ — Poor</option>
        </select>
      </div>
      <div class="form-group">
        <label>Comment (optional)</label>
        <textarea name="comment" rows="3" placeholder="Share details about your experience."></textarea>
      </div>
      <button type="submit" class="btn btn-amber btn-block">Submit Review</button>
    </form>
  </div>
</div>
{% endblock %}
