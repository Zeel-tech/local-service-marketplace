{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width:520px;">
  <div class="section-title" style="text-align:center;">Book {{ worker_profile.user.name }}</div>
  <div class="section-sub" style="text-align:center;">{{ worker_profile.category }} &middot; ₹{{ worker_profile.price_per_visit|int }}/visit</div>

  <div class="form-card">
    <form method="POST">
      <div class="form-group">
        <label>Preferred Date</label>
        <input type="date" name="service_date" required>
      </div>
      <div class="form-group">
        <label>Service Address</label>
        <input type="text" name="address" required placeholder="Where should they come?">
      </div>
      <div class="form-group">
        <label>Notes (optional)</label>
        <textarea name="notes" rows="3" placeholder="Describe the issue or any special instructions."></textarea>
      </div>
      <button type="submit" class="btn btn-amber btn-block">Send Booking Request</button>
    </form>
  </div>
</div>
{% endblock %}
