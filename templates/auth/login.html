{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width:520px;">
  <div class="section-title" style="text-align:center;">Welcome back</div>
  <div class="section-sub" style="text-align:center;">Log in to your FixLocal account.</div>

  <div class="form-card">
    <form method="POST">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-amber btn-block">Log In</button>
    </form>
    <p style="text-align:center; margin-top:16px; font-size:0.9rem;">
      New here? <a href="{{ url_for('auth.signup') }}" style="color:var(--amber-dark); font-weight:600;">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
